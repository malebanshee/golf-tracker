/* ================= 球杆 ================= */
const CLUB_KEYS = ["driver","wood3","wood5","hybrid3","hybrid4","iron3","iron4","iron5","iron6","iron7","iron8","iron9","pw","gw","sw","lw","putter"];
const CLUB_LABELS = {
  zh: {
    driver: "1号木 (Driver)", wood3: "3号木", wood5: "5号木",
    hybrid3: "3号混合杆", hybrid4: "4号混合杆",

    putter: "Putter"
  }
};

  return (CLUB_LABELS[lang] && CLUB_LABELS[lang][key]) || key;
}

/* ================= 数据层 =================
   主存储: IndexedDB (iOS 上比 localStorage 抗回收得多)
   镜像备份: localStorage (数据量很小,双写一份,IDB 出问题时还能兜底)
   db 常驻内存,所有读取仍是同步的;saveDB() 保持同步调用签名,内部异步落盘
*/
const STORAGE_KEY = "golfTrackerData_v1";
const IDB_NAME = "golfTrackerDB";
const IDB_STORE = "kv";
const IDB_KEY = "data";

let idbHandle = null;
let lastSaveError = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("no indexedDB"));
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGet(key) {
  return new Promise((resolve, reject) => {
    const tx = idbHandle.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbSet(key, value) {
  return new Promise((resolve, reject) => {
    const tx = idbHandle.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function readLocalStorageDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

async function initDB() {
  try {
    idbHandle = await openIDB();
    const fromIDB = await idbGet(IDB_KEY);
    if (fromIDB && Array.isArray(fromIDB.rounds)) return fromIDB;

    // IDB 里还没有数据 —— 看看是不是老版本用 localStorage 存的,是的话迁移过来
    const fromLS = readLocalStorageDB();
    if (fromLS && Array.isArray(fromLS.rounds)) {
      await idbSet(IDB_KEY, fromLS);
      return fromLS;
    }
    return { rounds: [] };
  } catch (e) {
    // IndexedDB 不可用(隐私模式等),退回纯 localStorage
    console.warn("IndexedDB 不可用,退回 localStorage:", e);
    idbHandle = null;
    return readLocalStorageDB() || { rounds: [] };
  }
}

function saveDB() {
  const snapshot = JSON.stringify(db);
  // 同步镜像一份到 localStorage(容量小,做兜底)
  try {
    localStorage.setItem(STORAGE_KEY, snapshot);
  } catch (e) {
    console.warn("localStorage 镜像写入失败:", e);
  }
  // 异步写主存储
  if (idbHandle) {
    idbSet(IDB_KEY, JSON.parse(snapshot)).catch(e => {
      lastSaveError = e;
      console.error("IndexedDB 写入失败:", e);
    });
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

let db = { rounds: [] };

function distanceMeters(a, b) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(m) {
  return t("distUnit", Math.round(m), Math.round(m * 1.09361));
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(t("locale"), { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

/* ================= 地图通用工具函数 (Google Maps) ================= */
function dotIcon(color, scale) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: scale || 11,
    fillColor: color,
    fillOpacity: 1,
    strokeColor: "#ffffff",
    strokeWeight: 2
  };
}
function dotLabel(text) {
  return { text: String(text), color: "#ffffff", fontSize: "11px", fontWeight: "700" };
}
function makeDotMarker(map, position, color, label) {
  const opts = { position, map, icon: dotIcon(color) };
  if (label) opts.label = dotLabel(label);
  return new google.maps.Marker(opts);
}
function drawDashedPolyline(map, path, color) {
  return new google.maps.Polyline({
    path, map,
    strokeOpacity: 0,
    icons: [{
      icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeColor: color, scale: 3 },
      offset: "0",
      repeat: "10px"
    }]
  });
}
function showInfo(map, marker, text) {
  const iw = new google.maps.InfoWindow({ content: `<div style="font-size:13px;font-weight:600;">${text}</div>` });
  iw.open({ map, anchor: marker });
  return iw;
}

/* ================= 路由 / 状态 ================= */
let route = { screen: "rounds" };
const app = document.getElementById("app");

function nav(newRoute) {
  closeMenus();
  route = newRoute;
  render();
}

function render() {
  if (route.screen === "rounds") return renderRounds();
  if (route.screen === "newRound") return renderNewRound();
  if (route.screen === "round") return renderRoundDetail(route.roundId);
  if (route.screen === "newHole") return renderNewHole(route.roundId);
  if (route.screen === "hole") return renderHoleDetail(route.roundId, route.holeId);
  if (route.screen === "markTee") return renderMarkTee(route.roundId, route.holeId);
  if (route.screen === "addShot") return renderAddShot(route.roundId, route.holeId, route.shotId);
}

function findRound(id) { return db.rounds.find(r => r.id === id); }
function findHole(round, id) { return round.holes.find(h => h.id === id); }
function holeShotsTotal(hole) {
  return hole.shots.reduce((sum, s) => sum + s.distanceMeters, 0);
}

// 杆数: 一般每条记录算1杆; 推杆记录里填了"几推进洞",就按实际推数算
function holeStrokeCount(hole) {
  return hole.shots.reduce((n, s) => {
    if (s.club === "putter" && s.puttCount > 1) return n + s.puttCount;
    return n + 1;
  }, 0);
}

function sortedShots(hole) {
  return [...hole.shots].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
}

/* 每一杆的 start 是保存时从"上一杆的 end"快照下来的。
   一旦编辑/删除了中间某一杆,后面那些杆的 start 就成了悬空的旧值,
   所以任何结构性改动之后都要重新按顺序把整条链串一遍,并重算距离。 */
function relinkShots(hole) {
  if (!hole.teeLocation) return;
  let prev = hole.teeLocation;
  sortedShots(hole).forEach(s => {
    s.start = prev;
    s.distanceMeters = distanceMeters(prev, s.end);
    prev = s.end;
  });
}

function finishHole(roundId, holeId) {
  const round = findRound(roundId);
  const hole = findHole(round, holeId);
  hole.finished = true;
  saveDB();
  nav({ screen: "round", roundId });
}

function initHoleMap(hole) {
  const el = document.getElementById("holeMap");
  if (!el) return;

  const shots = [...hole.shots].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const points = [hole.teeLocation, ...shots.map(s => s.end)];

  gmapHoleRoute = new google.maps.Map(el, {
    center: points[0],
    zoom: 17,
    mapTypeId: google.maps.MapTypeId.SATELLITE,
    disableDefaultUI: true,
    zoomControl: true,
    gestureHandling: "greedy"
  });

  if (points.length > 1) {
    drawDashedPolyline(gmapHoleRoute, points, "#1c6e35");
  }

  makeDotMarker(gmapHoleRoute, points[0], "#d63029", "T");
  shots.forEach((s, i) => makeDotMarker(gmapHoleRoute, s.end, "#1c6e35", String(i + 1)));

  if (points.length > 1) {
    const bounds = new google.maps.LatLngBounds();
    points.forEach(p => bounds.extend(p));
    gmapHoleRoute.fitBounds(bounds, 40);
  }
}

function deleteShot(roundId, holeId, shotId) {
  const round = findRound(roundId);
  const hole = findHole(round, holeId);
  const shots = sortedShots(hole);
  // 只允许删最后一杆: 删中间会让后面的杆接到一个物理上没发生过的起点上
  if (!shots.length || shots[shots.length - 1].id !== shotId) return;
  hole.shots = hole.shots.filter(s => s.id !== shotId);
  saveDB();
  render();
}

function initTeeMap() {

  const center = teeDraft || defaultCenter;

  gmapTee = new google.maps.Map(document.getElementById("teeMap"), {

    gestureHandling: "greedy"
  });

  teeMarkerObj = null;

  gmapTee.addListener("click", (e) => {

  if (!teeDraft && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {
      gmapTee.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude });

function useTeeGPS() {
  if (!navigator.geolocation) { alert(t("noGeoSupport")); return; }
  const btn = document.getElementById("teeGpsBtn");
  btn.textContent = t("locating");
  navigator.geolocation.getCurrentPosition((pos) => {
    btn.textContent = t("useGPS");
    setTeeCoordinate({ lat: pos.coords.latitude, lng: pos.coords.longitude });
  }, (err) => {
    btn.textContent = t("useGPS");
    alert(t("gpsFailed", err.message));
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function setTeeCoordinate(coord) {
  teeDraft = coord;
  if (teeMarkerObj) {
    teeMarkerObj.setPosition(coord);
  } else {
    teeMarkerObj = makeDotMarker(gmapTee, coord, "#d63029", "T");
  }
  if (teeInfoWindow) teeInfoWindow.close();
  teeInfoWindow = showInfo(gmapTee, teeMarkerObj, t("manualMarkStart"));
  gmapTee.panTo(coord);
  document.getElementById("saveTeeBtn").style.opacity = "1";
}

function saveTee(roundId, holeId) {
  if (!teeDraft) return;
  const round = findRound(roundId);
  const hole = findHole(round, holeId);
  hole.teeLocation = teeDraft;
  // 改了开球点,第一杆的起点和距离要跟着更新
  relinkShots(hole);
  saveDB();
  nav({ screen: "hole", roundId, holeId });
}

/* ================= 页面: 记录一杆 ================= */
let shotDraft = null;
let gmap = null;
let startMarkerObj = null;
let endMarkerObj = null;
let endInfoWindow = null;
let existingShotsForMap = [];
let addShotContext = { roundId: null, holeId: null };

function renderAddShot(roundId, holeId, shotId) {
  const round = findRound(roundId);
  const hole = findHole(round, holeId);
  if (!round || !hole) return nav({ screen: "rounds" });

  const allShots = sortedShots(hole);
  const editIndex = shotId ? allShots.findIndex(s => s.id === shotId) : -1;
  const isEdit = editIndex >= 0;
  const existing = isEdit ? allShots[editIndex] : null;

  // 编辑时,这一杆的起点由它"之前"的杆决定,地图上也只画它之前的杆作为参考
  const priorShots = isEdit ? allShots.slice(0, editIndex) : allShots;
  const startPoint = priorShots.length > 0 ? priorShots[priorShots.length - 1].end : hole.teeLocation;

  existingShotsForMap = priorShots;
  addShotContext = { roundId, holeId };

  shotDraft = {
    shotId: shotId || null,
    club: existing ? existing.club : CLUB_KEYS[0],
    start: startPoint,
    end: existing ? existing.end : null,
    puttCount: existing ? (existing.puttCount ?? null) : null,
    firstPuttDistanceFeet: existing ? (existing.firstPuttDistanceFeet ?? null) : null
  };
  startMarkerObj = null;
  endMarkerObj = null;
  endInfoWindow = null;

  const shotNumber = isEdit ? editIndex + 1 : allShots.length + 1;

  app.innerHTML = `
    <header>
      <div class="back" onclick="nav({screen:'hole', roundId:'${round.id}', holeId:'${hole.id}'})">‹</div>
      <h1>${isEdit ? t("editShotN", shotNumber) : t("recordShotN", shotNumber)}</h1>
      <div class="action" id="saveBtn" style="opacity:0.4" onclick="saveShot()">${t("save")}</div>
    </header>
    <main id="addShotMain"></main>
  `;

  renderAddShotMain();
}

// 球杆选择会切换UI(尤其是选/取消Putter),所以拆成独立函数,可以局部重渲染而不用整页跳转
function renderAddShotMain() {
  const isPutter = shotDraft.club === "putter";

  document.getElementById("addShotMain").innerHTML = `
    <div class="field">
      <label>${t("selectClub")}</label>
      <select id="clubSelect" onchange="onClubChange(this.value)">
        ${CLUB_KEYS.map(k => `<option value="${k}" ${k === shotDraft.club ? "selected" : ""}>${clubLabel(k)}</option>`).join("")}
      </select>
    </div>

    ${isPutter ? `
      <div class="field">
        <label>${t("puttCountLabel")}</label>
        <input id="puttCountInput" type="number" inputmode="numeric" min="1"
          value="${shotDraft.puttCount ?? ""}"
          oninput="shotDraft.puttCount = this.value ? parseInt(this.value, 10) : null; updateSaveButtonState();">
      </div>
      <div class="field">
        <label>${t("firstPuttDistanceLabel")}</label>
        <input id="firstPuttDistInput" type="number" inputmode="decimal" min="0" step="0.1"
          value="${shotDraft.firstPuttDistanceFeet ?? ""}"
          oninput="shotDraft.firstPuttDistanceFeet = this.value ? parseFloat(this.value) : null;">
      </div>
    ` : ""}

    <button class="btn secondary" id="gpsBtn" onclick="useGPS()">${t("useGPS")}</button>
    <div class="hint">${isPutter ? t("markHoleHint") : t("markLandingHint")}</div>

    <div id="map"></div>

    <div id="distanceBox"></div>
  `;

  setTimeout(initMap, 50);
}

function onClubChange(value) {
  const wasPutter = shotDraft.club === "putter";
  const isPutter = value === "putter";
  shotDraft.club = value;

  // 只有putter状态真的变了(这一点的含义从"落点"变成"球洞位置"或反过来),之前标的点才作废
  if (wasPutter !== isPutter) {
    shotDraft.end = null;
  }
  if (!isPutter) {
    shotDraft.puttCount = null;
    shotDraft.firstPuttDistanceFeet = null;
  }
  renderAddShotMain();
}

function initMap() {
  gmap = new google.maps.Map(document.getElementById("map"), {
    center: shotDraft.start,
    zoom: 19,
    mapTypeId: google.maps.MapTypeId.SATELLITE,
    disableDefaultUI: true,
    zoomControl: true,
    gestureHandling: "greedy"
  });

  // 本洞之前已经记录的杆:路线 + 编号标记,作为参考一直保留在地图上
  let existingPoints = [];
  if (existingShotsForMap.length > 0) {
    existingPoints.push(existingShotsForMap[0].start);
    existingShotsForMap.forEach(s => existingPoints.push(s.end));

    drawDashedPolyline(gmap, existingPoints, "#1c6e35");
    makeDotMarker(gmap, existingPoints[0], "#d63029", "T");
    existingShotsForMap.forEach((s, i) => makeDotMarker(gmap, s.end, "#1c6e35", String(i + 1)));
  }

  // 这一杆固定的起点(上一杆落点,或第一杆时是开球点)—— 只读,不可在这里编辑
  startMarkerObj = makeDotMarker(gmap, shotDraft.start, "#1c6e35", "S");

  endMarkerObj = null;
  endInfoWindow = null;

  // 如果这一点之前已经标过(比如切换球杆前标的落点,普通杆之间互换不会清掉),重新建图时要画回来
  if (shotDraft.end) {
    const isPutter = shotDraft.club === "putter";
    const color = isPutter ? "#222222" : "#d63029";
    const label = isPutter ? "H" : null;
    endMarkerObj = makeDotMarker(gmap, shotDraft.end, color, label);
    endInfoWindow = showInfo(gmap, endMarkerObj, isPutter ? t("holeMarkerLabel") : t("manualMarkEnd"));
  }

  gmap.addListener("click", (e) => {
    setCoordinate({ lat: e.latLng.lat(), lng: e.latLng.lng() });
  });

  if (existingPoints.length > 0 || shotDraft.end) {
    const bounds = new google.maps.LatLngBounds();
    existingPoints.forEach(p => bounds.extend(p));
    bounds.extend(shotDraft.start);
    if (shotDraft.end) bounds.extend(shotDraft.end);
    gmap.fitBounds(bounds, 60);
  }

  updateDistanceBox();
}

function useGPS() {
  if (!navigator.geolocation) {
    alert(t("noGeoSupport"));
    return;
  }
  const btn = document.getElementById("gpsBtn");
  btn.textContent = t("locating");
  navigator.geolocation.getCurrentPosition((pos) => {
    btn.textContent = t("useGPS");
    setCoordinate({ lat: pos.coords.latitude, lng: pos.coords.longitude });
  }, (err) => {
    btn.textContent = t("useGPS");
    alert(t("gpsFailed", err.message));
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function setCoordinate(coord) {
  shotDraft.end = coord;
  const isPutter = shotDraft.club === "putter";
  const color = isPutter ? "#222222" : "#d63029";
  const label = isPutter ? "H" : null;

  if (endMarkerObj) {
    endMarkerObj.setPosition(coord);
    endMarkerObj.setIcon(dotIcon(color));
    endMarkerObj.setLabel(label ? dotLabel(label) : null);
  } else {
    endMarkerObj = makeDotMarker(gmap, coord, color, label);
  }

  if (endInfoWindow) endInfoWindow.close();
  endInfoWindow = showInfo(gmap, endMarkerObj, isPutter ? t("holeMarkerLabel") : t("manualMarkEnd"));

  gmap.panTo(coord);
  updateDistanceBox();
}

function updateDistanceBox() {
  const box = document.getElementById("distanceBox");
  if (shotDraft.end) {
    const d = distanceMeters(shotDraft.start, shotDraft.end);
    box.innerHTML = `<div class="card distance-badge">${fmtDist(d)}</div>`;
  } else {
    box.innerHTML = "";
  }
  updateSaveButtonState();
}

function updateSaveButtonState() {
  const saveBtn = document.getElementById("saveBtn");
  if (!saveBtn) return;
  const isPutter = shotDraft.club === "putter";
  let ok = !!shotDraft.end;
  if (isPutter) {
    ok = ok && Number.isInteger(shotDraft.puttCount) && shotDraft.puttCount > 0;
  }
  saveBtn.style.opacity = ok ? "1" : "0.4";
}

function saveShot() {
  const { roundId, holeId } = addShotContext;
  if (!shotDraft.end) return;
  const isPutter = shotDraft.club === "putter";
  if (isPutter && !(Number.isInteger(shotDraft.puttCount) && shotDraft.puttCount > 0)) return;

  const round = findRound(roundId);
  const hole = findHole(round, holeId);
  const isEdit = !!shotDraft.shotId;

  if (isEdit) {
    const shot = hole.shots.find(s => s.id === shotDraft.shotId);
    if (!shot) return nav({ screen: "hole", roundId, holeId });
    // timestamp 是排序依据,编辑时必须保持不变,否则这一杆会被挪到序列末尾
    shot.club = shotDraft.club;
    shot.end = shotDraft.end;
    if (isPutter) {
      shot.puttCount = shotDraft.puttCount;
      shot.firstPuttDistanceFeet = shotDraft.firstPuttDistanceFeet;
    } else {
      delete shot.puttCount;
      delete shot.firstPuttDistanceFeet;
    }
  } else {
    const shot = {
      id: uid(),
      club: shotDraft.club,
      start: shotDraft.start,
      end: shotDraft.end,
      distanceMeters: distanceMeters(shotDraft.start, shotDraft.end),
      timestamp: new Date().toISOString()
    };
    if (isPutter) {
      shot.puttCount = shotDraft.puttCount;
      shot.firstPuttDistanceFeet = shotDraft.firstPuttDistanceFeet;
    }
    hole.shots.push(shot);
  }

  // 改了落点会让后面那一杆的起点失效,整条链重新串一遍
  relinkShots(hole);

  if (isPutter && !isEdit) {
    // 新记录一个推杆 = 这一洞结束(编辑已有推杆不改变本洞完成状态)
    hole.finished = true;
    saveDB();
    nav({ screen: "round", roundId });
  } else {
    saveDB();
    nav({ screen: "hole", roundId, holeId });
  }
}

/* ================= 工具函数 ================= */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function tsStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

// iOS Safari 上 <a download> 对 blob 支持不稳定,优先走系统分享面板(可存到"文件"/发给自己)
async function shareOrDownload(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  try {
    const file = new File([blob], filename, { type: mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return; // 用户自己取消了分享,不当作失败
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ================= 数据导出 / 导入 ================= */
function exportJSON() {
  const payload = { exportedAt: new Date().toISOString(), version: 1, ...db };
  shareOrDownload(`golf-backup-${tsStamp()}.json`, JSON.stringify(payload, null, 2), "application/json");
}

function csvCell(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCSV() {
  const header = [
    "round_id", "course_name", "round_date",
    "hole_number", "hole_finished", "hole_strokes",
    "tee_lat", "tee_lng",
    "shot_index", "club",
    "start_lat", "start_lng", "end_lat", "end_lng",
    "distance_m", "distance_yd",
    "putt_count", "first_putt_distance_ft",
    "timestamp"
  ];
  const rows = [header.join(",")];

  [...db.rounds]
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .forEach(r => {
      [...r.holes].sort((a, b) => a.number - b.number).forEach(h => {
        const shots = sortedShots(h);
        const strokes = holeStrokeCount(h);
        if (shots.length === 0) {
          rows.push([
            r.id, r.courseName, r.date,
            h.number, h.finished ? 1 : 0, strokes,
            h.teeLocation?.lat ?? "", h.teeLocation?.lng ?? "",
            "", "", "", "", "", "", "", "", "", "", ""
          ].map(csvCell).join(","));
          return;
        }
        shots.forEach((s, i) => {
          rows.push([
            r.id, r.courseName, r.date,
            h.number, h.finished ? 1 : 0, strokes,
            h.teeLocation?.lat ?? "", h.teeLocation?.lng ?? "",
            i + 1, s.club,
            s.start.lat, s.start.lng, s.end.lat, s.end.lng,
            s.distanceMeters.toFixed(2), (s.distanceMeters * 1.09361).toFixed(2),
            s.puttCount ?? "", s.firstPuttDistanceFeet ?? "",
            s.timestamp
          ].map(csvCell).join(","));
        });
      });
    });

  // BOM: 让 Excel 正确识别 UTF-8,否则中文球场名会乱码
  shareOrDownload(`golf-shots-${tsStamp()}.csv`, "\ufeff" + rows.join("\n"), "text/csv");
}

function triggerImport() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.rounds)) throw new Error("bad format");
        if (!confirm(t("confirmImport", parsed.rounds.length))) return;
        db = { rounds: parsed.rounds };
        saveDB();
        nav({ screen: "rounds" });
      } catch (e) {
        alert(t("importFailed"));
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  db = await initDB();
  render();
